<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta name="author" content="{{ site.github_username }}">
    <meta name="theme-color" content="#8C9ED9">

    <title>{% if page.layout == 'front' %}{{ site.title }}{% else %}{{ page.title }} · {{ site.title }}{% endif %}</title>

    <link rel="stylesheet" href="{{ '/css/bootstrap.min.css' | relative_url }}" type="text/css">
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&family=Noto+Sans+KR:wght@300;400;700;900&family=Noto+Serif+KR:wght@300;400;700&family=Open+Sans:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/font-awesome/css/font-awesome.min.css' | relative_url }}" type="text/css">
    <link rel="stylesheet" href="{{ '/css/animate.min.css' | relative_url }}" type="text/css">
    <link rel="stylesheet" href="{{ '/css/main.css' | relative_url }}" type="text/css">
</head>
