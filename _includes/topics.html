<section id="topics">
    <div class="container">
        <div class="row">
            <div class="col-lg-12 text-center">
                <h2 class="section-heading">{{ site.topics.heading }}</h2>
                <hr class="primary">
            </div>
        </div>
        <div class="row">
            {% for item in site.topics.items %}
            <div class="col-lg-3 col-md-6 text-center">
                <div class="service-box">
                    <i class="fa fa-4x {{ item.icon }} wow bounceIn text-primary"{% if forloop.index0 != 0 %} data-wow-delay=".{{ forloop.index0 }}s"{% endif %}></i>
                    <h3>{{ item.title }}</h3>
                    <p class="text-muted">{{ item.text }}</p>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
