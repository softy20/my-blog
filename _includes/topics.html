<section class="section-steps" id="topics">
    <div class="container">
        <div class="row">
            <div class="col-lg-12 text-center">
                <span class="eyebrow">{{ site.topics.eyebrow }}</span>
                <h2 class="section-heading">{{ site.topics.heading }}</h2>
            </div>
        </div>
        <div class="row steps-grid">
            {% for item in site.topics.items %}
            <div class="col-lg-3 col-md-6">
                <div class="step-card wow fadeInUp"{% if forloop.index0 != 0 %} data-wow-delay=".{{ forloop.index0 }}s"{% endif %}>
                    <span class="step-index">{% if forloop.index < 10 %}0{{ forloop.index }}{% else %}{{ forloop.index }}{% endif %}</span>
                    <i class="fa {{ item.icon }} step-icon"></i>
                    <h3>{{ item.title }}</h3>
                    <p>{{ item.text }}</p>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
