<!DOCTYPE html>
<html lang="ko">

{% include head.html %}

<body id="page-top">
  {% include nav.html %}
  <header class="post-header">
    <div class="header-content">
      <div class="header-content-inner">
        <p class="post-meta">{{ page.date | date: "%Y.%m.%d" }}</p>
        <h1>{{ page.title }}</h1>
      </div>
    </div>
  </header>
  <article class="article">
    <div class="container">
      <div class="row">
        <div class="col-lg-8 col-lg-offset-2">
          {{ content }}
          <a class="back-link" href="{{ '/' | relative_url }}#posts">← 글 목록으로</a>
        </div>
      </div>
    </div>
  </article>
  {% include contact.html %}
  {% include scripts.html %}
</body>

</html>
